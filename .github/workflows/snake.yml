name: Generate contribution snake

on:
  # Twice a day, on the hour. NOTE: "* */12 * * *" (as seen in some tutorials)
  # means "every minute of hours 0 and 12" — 120 runs a day, not 2.
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

# Least privilege: the job only needs to push the generated SVGs.
permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and publish snake SVGs
    runs-on: ubuntu-latest
    steps:
      - name: Generate light and dark animations
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
